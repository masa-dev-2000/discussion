[package]
name = "sennin-kaigi"
version = "0.1.0"
description = "先人会議 — 時を超えた知性の討論"
edition = "2021"

[lib]
name = "sennin_kaigi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
